<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1380" width="900" height="1380"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-labelledby="lifeTitle lifeDesc">
  <title id="lifeTitle">Security PHP 请求生命周期</title>
  <desc id="lifeDesc">一个 HTTP 请求从进入中间件开始：注入安全响应头、IP 白名单与封禁检查、字段白名单与扁平化、检测器链扫描、编码归一化重扫、身份维度校验；无威胁则放行，有威胁则写日志并按 block 模式决定放行或拦截，拦截响应返回检测器自带状态码，浏览器请求额外获得小盾拦截页。</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="900" height="1380" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A">Security PHP · 请求生命周期</text>
  <text x="40" y="72" font-size="13" fill="#64748B">一次 guard() 调用的完整路径：短路点、检测点、状态持久化与两条出口</text>

  <!-- 起点 -->
  <rect x="200" y="100" width="240" height="44" rx="22" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="320" y="128" font-size="14" font-weight="600" fill="#1E40AF" text-anchor="middle">HTTP 请求到达</text>
  <path d="M320 144 L320 176" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ① 提取 -->
  <rect x="90" y="182" width="460" height="58" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="110" y="206" font-size="13.5" font-weight="600" fill="#1E293B">① 入口层提取请求数据</text>
  <text x="110" y="226" font-size="11.5" fill="#64748B">中间件 / security_guard()：GET · POST · COOKIE · FILES，同名跨来源一并保留</text>
  <path d="M320 240 L320 272" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ② 响应头 -->
  <rect x="90" y="278" width="460" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="110" y="300" font-size="13.5" font-weight="600" fill="#1E293B">② 注入安全响应头</text>
  <text x="110" y="316" font-size="11.5" fill="#64748B">放行与拦截两条路径都带 —— 包括被拦下的这一条</text>
  <path d="M320 324 L320 356" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ◇ IP 白名单 -->
  <path d="M320 366 L450 400 L320 434 L190 400 Z" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="320" y="405" font-size="13" font-weight="600" fill="#92400E" text-anchor="middle">IP 在白名单？</text>
  <path d="M450 400 L610 400" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="466" y="393" font-size="11.5" fill="#059669">是</text>
  <rect x="620" y="379" width="240" height="42" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="740" y="405" font-size="12.5" fill="#065F46" text-anchor="middle">直接放行 · 跳过全部检测</text>
  <path d="M320 434 L320 466" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="330" y="456" font-size="11.5" fill="#DC2626">否</text>

  <!-- ◇ IP 封禁 -->
  <path d="M320 476 L450 510 L320 544 L190 510 Z" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="320" y="515" font-size="13" font-weight="600" fill="#92400E" text-anchor="middle">IP 处于封禁期？</text>
  <path d="M450 510 L610 510" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="466" y="503" font-size="11.5" fill="#059669">是</text>
  <rect x="620" y="489" width="240" height="42" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="740" y="515" font-size="12.5" fill="#991B1B" text-anchor="middle">403 · 不再进入检测链</text>
  <path d="M320 544 L320 576" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="330" y="566" font-size="11.5" fill="#DC2626">否</text>

  <!-- ③ 扁平化 -->
  <rect x="90" y="582" width="460" height="58" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="110" y="606" font-size="13.5" font-weight="600" fill="#1E293B">③ 字段白名单过滤 + 嵌套扁平化</text>
  <text x="110" y="626" font-size="11.5" fill="#64748B">user.name → 点号路径；数组额外 JSON 编码后送检；注入 _server.* 元数据</text>
  <path d="M320 640 L320 672" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ④⑤ 扫描 -->
  <rect x="90" y="678" width="460" height="76" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="110" y="702" font-size="13.5" font-weight="600" fill="#1E40AF">④ 检测器链扫描 · ⑤ 编码归一化重扫</text>
  <text x="110" y="722" font-size="11.5" fill="#3B82F6">31 个检测器按 priority 顺序执行，每个独立 block / log；扫描前设 pcre.backtrack_limit</text>
  <text x="110" y="741" font-size="11.5" fill="#3B82F6">带编码信号的值额外解一次（URL / 双重编码 / 全角 / HTML 实体），原值与解码值都参与</text>
  <path d="M320 754 L320 786" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ⑥ 身份 -->
  <rect x="90" y="792" width="460" height="58" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="110" y="816" font-size="13.5" font-weight="600" fill="#1E293B">⑥ 身份维度校验（链外 IdentityGuard）</text>
  <text x="110" y="836" font-size="11.5" fill="#64748B">会话劫持 · 异地登录 · 数据篡改 · 暴力破解锁定 —— 威胁并入同一份列表</text>
  <path d="M320 850 L320 882" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ◇ 有无威胁 -->
  <path d="M320 892 L450 926 L320 960 L190 926 Z" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="320" y="931" font-size="13" font-weight="600" fill="#92400E" text-anchor="middle">本次请求有威胁？</text>
  <path d="M450 926 L610 926" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="466" y="919" font-size="11.5" fill="#059669">否</text>
  <rect x="620" y="905" width="240" height="42" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="740" y="931" font-size="12.5" fill="#065F46" text-anchor="middle">放行 · 业务响应 + 安全响应头</text>
  <path d="M320 960 L320 992" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="330" y="982" font-size="11.5" fill="#DC2626">是</text>

  <!-- ⑦ 日志 -->
  <rect x="90" y="998" width="460" height="76" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="110" y="1022" font-size="13.5" font-weight="600" fill="#1E293B">⑦ 写攻击日志 + 记录 IP 攻击次数</text>
  <text x="110" y="1042" font-size="11.5" fill="#64748B">5 秒去重 · 超 max_size 轮转 · CRLF 已转义；敏感值在日志里做掩码</text>
  <text x="110" y="1061" font-size="11.5" fill="#64748B">仅 block 模式的威胁计入 IpBlacklist：窗口内 5 次 → 封禁 15 分钟</text>
  <path d="M320 1074 L320 1106" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ◇ shouldBlock -->
  <path d="M320 1116 L450 1150 L320 1184 L190 1150 Z" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="320" y="1155" font-size="13" font-weight="600" fill="#92400E" text-anchor="middle">任一威胁为 block 模式？</text>
  <path d="M450 1150 L610 1150" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="466" y="1143" font-size="11.5" fill="#B45309">否（仅 log）</text>
  <rect x="620" y="1129" width="240" height="42" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="740" y="1155" font-size="12.5" fill="#92400E" text-anchor="middle">放行 + 仅记录</text>

  <!-- 出口 -->
  <path d="M320 1184 L320 1206" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="90" y="1212" width="460" height="76" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="110" y="1236" font-size="13.5" font-weight="600" fill="#991B1B">⑧ 拦截响应 —— 状态码取检测器自带值</text>
  <text x="110" y="1256" font-size="11.5" fill="#B91C1C">401 / 403 / 405 / 413 / 415 / 429，认证逻辑不再执行</text>
  <text x="110" y="1274" font-size="11.5" fill="#B91C1C">Accept: text/html → 小盾 HTML 拦截页，否则纯文本</text>

  <!-- 小盾（拦截页里的项目宠物，简化内联版） -->
  <g transform="translate(474 1216) scale(0.3)">
    <path d="M100 18 C118 28 142 37 160 41 C165 42 168 46 168 51 C168 106 148 152 100 180 C52 152 32 106 32 51 C32 46 35 42 40 41 C58 37 82 28 100 18 Z" fill="#3B82F6"/>
    <ellipse cx="76" cy="84" rx="11" ry="13" fill="#FFFFFF"/>
    <ellipse cx="124" cy="84" rx="11" ry="13" fill="#FFFFFF"/>
    <circle cx="78" cy="86" r="5.5" fill="#12305F"/>
    <circle cx="126" cy="86" r="5.5" fill="#12305F"/>
    <path d="M88 103 Q100 115 112 103" fill="none" stroke="#12305F" stroke-width="5" stroke-linecap="round"/>
  </g>

  <path d="M320 1288 L320 1312" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="200" y="1318" width="240" height="42" rx="21" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="320" y="1345" font-size="13.5" font-weight="600" fill="#1E40AF" text-anchor="middle">响应返回客户端</text>
</svg>
